$:
    vscode:
        - docker:
            image: docker.cnb.cool/xmzzuzhi/cnb-docker/python:0.0.1
          imports:
            - https://cnb.cool/XMZZUZHI/key/-/blob/main/Claude.yml
          runner:
            cpus: 32
          services:
            - vscode
            - docker
          stages:
              - name: 授予install_gpg_keys.sh权限
                script:
                    - chmod +x /workspace/install_gpg_keys.sh
              - name: 安装iflow CLI
                script:
                    - npm i -g @iflow-ai/iflow-cli@latest
                    - echo "iflow CLI安装完成"
              - name: 下载并替换settings.json
                script:
                    - mkdir -p /root/.iflow
                    - curl -o /root/.iflow/settings.json https://cnb-1329111128.cos.ap-guangzhou.myqcloud.com/1.json
                    - echo "已下载并替换 /root/.iflow/settings.json"
              - name: 安装claude CLI
                script:
                    - npm install -g @anthropic-ai/claude-code
                    - echo "claude CLI安装完成"
              - name: 安装qwen CLI
                script:
                    - npm install -g @qwen-code/qwen-code@latest
                    - echo "qwen CLI安装完成"
              - name: 安装CodeBuddy CLI
                script:
                    - npm install -g @tencent-ai/codebuddy-code
                    - echo "CodeBuddy CLI安装完成"
              - name: 安装KIMI code
                script:
                    - curl -LsSf https://code.kimi.com/install.sh | bash
                    - echo "KIMI code安装完成"
              - name: 安装Qoder CLI
                script:
                  - curl -fsSL https://qoder.com/install | bash
                  - echo "Qoder CLI安装完成"
              - name: 安装sudo更新APT源
                script:
                    - sudo apt-get update
                    - sudo apt-get install -y lsof net-tools jq
                    - echo "依赖完成"
              - name: 安装Git LFS
                script:
                    - sudo apt-get install -y git-lfs
                    - git lfs install
                    - echo "Git LFS安装完成"
              - name: 创建codebuddy配置文件夹
                script:
                    - mkdir -p /root/.codebuddy
                    - curl -o /root/.codebuddy/models.json https://cnb-1329111128.cos.ap-guangzhou.myqcloud.com/codebuddy.json
                    - echo "已创建 root/.codebuddy 文件夹并下载 models.json"
              - name: 安装iflow智能体
                script:
                    - chmod +x /workspace/install_agents.sh
                    - /workspace/install_agents.sh
              - name: 克隆Astrbot并重新克隆
                script:
                  - git clone https://github.com/AstrBotDevs/AstrBot.git /tmp/astrbot-tmp
                  - cp -r /tmp/astrbot-tmp/astrbot /workspace
                  - rm -rf /tmp/astrbot-tmp
                  - git clone https://github.com/AstrBotDevs/AstrBot.git

main:
      # CNB 是主仓，PR 分支不镜像到 GitHub，故覆盖率门禁在 CNB 侧跑。
      # 测试用 tests/stubs 桩掉 astrbot/sketchbook 重依赖，无需克隆宿主即可稳定出报告。
      pull_request:
        - docker:
            image: docker.cnb.cool/xmzzuzhi/cnb-docker/python:0.0.1
          runner:
            cpus: 4
          stages:
            - name: 安装测试依赖
              script:
                    - pip install --upgrade pip
                    - pip install -r requirements-dev.txt
            - name: 单元测试与覆盖率
              # 整段放一个 script 块：CNB 用 && 拼接数组项，多行内容拆开会语法错。
              script:
                    - |
                      set -e
                      python -m tests.run_coverage
                      # testing:coverage 不支持 coverage.py 的 XML，改由 lcov 上报。
                      coverage lcov -o lcov.info
                      # 过滤零语句文件（如 __init__.py）的无 LF 记录，避免汇总 NaN。
                      awk 'BEGIN { RS="end_of_record"; ORS="end_of_record\n" } /LF:/ { print }' lcov.info > lcov.filtered.info
                      mv lcov.filtered.info lcov.info
            - name: 上报单测覆盖率
              type: testing:coverage
              options:
                    pattern: lcov.info
                    # 报告缺失说明上游没产出，直接失败，避免「静默不上报」。
                    breakIfNoCoverage: true
      # push 到 main：只做镜像同步，覆盖率由上面的 PR 门禁与 GitHub Actions 负责。
      push:
        - services:
            - docker
          imports:
            - https://cnb.cool/XMZZUZHI/key/-/blob/main/Github.yml
          stages:
            - name: 同步到GitHub
              image: tencentcom/git-sync
              settings:
                target_url: https://github.com/xiaomizhoubaobei/astrbot_plugin_manosaba-memes.git
                auth_type: https
                username: ${GIT_USERNAME}
                password: ${GIT_ACCESS_TOKEN}
                branch: main
                git_user: ${GIT_USERNAME}
                git_email: ${GIT_EMAIL}
